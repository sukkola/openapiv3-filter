schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Tech stack: Rust (edition 2024), compiled to a single CLI binary `openapiv3-filter`.
  Key dependencies: `openapiv3` (2.0.0) for the OpenAPI document model, `serde_yaml` / `serde_json`
  for parsing, `clap` (derive) for the CLI, `wildmatch` for glob-style filter matching, `indexmap`
  for order-preserving maps. Dev/test stack: `assert_cmd`, `rexpect` (CLI/stdin behavior), `insta`
  (snapshot testing of filtered output).

  Domain: the tool reads an OpenAPI v3 document (YAML or JSON, file or stdin) and emits a reduced
  document containing only the operations/components that match CLI filters (`--path`, `--method`,
  `--tag`, `--security`), pulling in their transitive `$ref` dependencies so the result stays a
  valid, self-contained OpenAPI document.

  Source layout: `src/main.rs` (CLI entry), `src/parser.rs` (YAML/JSON -> OpenAPI model),
  `src/filter/openapi.rs` (top-level filter orchestration), `src/filter/content/` (reference
  collection/processing and JSON-path-based filtering of components). Integration tests live in
  `tests/`, with fixtures in `tests/resources/` and accepted snapshots in `tests/snapshots/` /
  `src/filter/snapshots/`.

  Known constraint to validate before designing: the `openapiv3` crate models OpenAPI 3.0.x; full
  OpenAPI 3.1 support (JSON Schema 2020-12 schemas, webhooks, nullable-via-type-arrays, etc.) may
  require a different/updated crate or a custom model layer — confirm current crate capabilities
  before committing to an approach.

  Conventions: snapshot tests via `insta` (review with `cargo insta review`); keep filtering
  logic pure/testable and separate from CLI/IO concerns; prefer extending the existing
  `filter/content` reference-collection pattern over introducing a parallel filtering mechanism.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - State plainly whether OpenAPI 3.0 and 3.1 can share one internal document model or need
      separate code paths, and why.
    - Call out any crate/dependency changes (e.g. replacing or augmenting `openapiv3`) as a
      first-class decision, not an implementation detail.
  design:
    - Enumerate the OpenAPI structural elements the current filter does NOT yet traverse/preserve
      (e.g. webhooks, callbacks, links, discriminators, examples, servers, external docs) and
      state which are in scope for this change.
    - Describe how version detection (3.0.x vs 3.1.x) happens and how it affects parsing and
      filtering behavior.
  tasks:
    - Include a task to add/extend fixtures and snapshot tests for both 3.0 and 3.1 inputs for
      every newly-supported structural element.
    - Require full coverage testing: every requirement and scenario defined in specs/ must map to
      at least one automated test (unit, integration, or snapshot) before the change is considered
      done; include an explicit task to verify this traceability (spec scenario -> test) and a task
      to measure/enforce code coverage (e.g. `cargo llvm-cov` or `cargo tarpaulin`) on the filtering
      engine, not just add tests ad hoc.
