name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Install deny
        run: cargo install cargo-deny
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Lint
        run: cargo clippy --workspace --all-targets
      - name: Run cargo deny check
        run: cargo deny check licenses
      - name: Build
        run: cross build -p openapiv3-filter --target ${{ matrix.target }} --release
      - name: Run tests
        run: cross test --workspace --target ${{ matrix.target }} --release
      - name: Lint (yaml-lean only)
        run: cargo clippy -p openapiv3-filter-core --no-default-features --features yaml-lean --all-targets
      - name: Test (yaml-lean only, plus differential tests against yaml-saphyr)
        run: |
          cargo test -p openapiv3-filter-core --no-default-features --features yaml-lean
          cargo test -p openapiv3-filter-core --features yaml-lean
      - name: Check wasm32 build (both YAML implementations)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p openapiv3-filter-core --target wasm32-unknown-unknown
          cargo check -p openapiv3-filter-core --no-default-features --features yaml-lean --target wasm32-unknown-unknown
      - name: Check test coverage
        # Minimum line coverage for crates/core/src/parser.rs,
        # crates/core/src/filter/openapi.rs, and crates/core/src/filter/content/* (the
        # engine this change rewrote) — see
        # openspec/changes/full-openapi-3-0-3-1-support/traceability.md. Set comfortably
        # below the ~98-100% currently achieved per file so incidental variance doesn't
        # flake the build, while still catching a real coverage regression.
        #
        # --features yaml-lean (default-features still on, so yaml-saphyr stays enabled too)
        # is required for this to measure crates/core/src/yaml/lean/* at all: that module is
        # compiled out entirely without the feature, and most of its own coverage comes from
        # tests/yaml_differential.rs, which only runs (and only compiles) when both YAML
        # features are enabled together — yaml-lean alone, without yaml-saphyr, does not
        # exercise it anywhere near as thoroughly.
        run: cargo llvm-cov --workspace --features yaml-lean --summary-only --fail-under-file-lines 90
